<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scientific Problem-Solving Platform</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="main.css" />
  <script type="module" src="main.js"></script>
</head>
<body>
  <!-- Global App Header -->
  <header class="app-header">
    <div class="container header-container">
      <div class="brand">Scientific Problem-Solving Platform</div>
      <div class="problem-selector">
        <label for="module-select">Module:</label>
        <select id="module-select"></select>
      </div>
    </div>
  </header>

  <!-- Section 01 — Editorial opening (Dynamic) -->
  <section class="editorial">
    <div class="container">
      <h1 id="module-name"></h1>
      <p id="module-description" class="subtitle"></p>
      
      <div id="module-intro-container" class="intro-text"></div>

      <div class="run-controls" id="module-controls">
        <div class="run-status">
          <span class="status-label">Status:</span>
          <span id="status" role="status">Loading module...</span>
        </div>
        <div class="actions" id="module-actions">
          <!-- Dynamic buttons and inputs -->
        </div>
      </div>
    </div>
  </section>

  <!-- Main Scientific Canvas -->
  <div class="scientific-canvas">
    <!-- Dynamic visualizations go here -->
    <main class="container main-grid" id="module-workspace"></main>
    
    <!-- Solution / Decision presentation -->
    <section class="container panel solution-panel" id="module-solution" style="display: none; margin-bottom: 2rem;">
      <header class="panel-header">
        <h2>Computed Solution & Recommendations</h2>
      </header>
      <div class="solution-content" id="solution-content"></div>
    </section>

    <!-- Methodology -->
    <footer class="methodology container" id="module-methodology">
      <h2>Methodology & References</h2>
      <div id="methodology-content"></div>
    </footer>
  </div>

</body>
</html>
